<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Use Case Diagram for the Gynecology Clinic Digitalization System</title>
  <desc id="desc">A UML-style use case diagram showing Doctor or Clinic Staff interacting with login, dashboard, patient management, clinical care, appointment, and billing functions.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .system { fill: #f8fafc; stroke: #334155; stroke-width: 2.5; }
      .group { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .group-title { font: 700 22px Arial, sans-serif; fill: #334155; }
      .title { font: 700 28px Arial, sans-serif; fill: #0f172a; }
      .actor-text { font: 700 22px Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
      .case { fill: #e0f2fe; stroke: #0369a1; stroke-width: 2; }
      .case-text { font: 600 18px Arial, sans-serif; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .line { stroke: #475569; stroke-width: 2; fill: none; }
      .dash { stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 8 6; fill: none; }
      .rel { font: 600 15px Arial, sans-serif; fill: #475569; text-anchor: middle; }
    </style>
  </defs>

  <rect class="bg" width="1400" height="900"/>

  <text class="title" x="720" y="48" text-anchor="middle">Gynecology Clinic Digitalization System - Use Case Diagram</text>

  <g id="actor">
    <circle cx="135" cy="350" r="34" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
    <line x1="135" y1="384" x2="135" y2="500" stroke="#0f172a" stroke-width="3"/>
    <line x1="82" y1="425" x2="188" y2="425" stroke="#0f172a" stroke-width="3"/>
    <line x1="135" y1="500" x2="86" y2="585" stroke="#0f172a" stroke-width="3"/>
    <line x1="135" y1="500" x2="184" y2="585" stroke="#0f172a" stroke-width="3"/>
    <text class="actor-text" x="135" y="635">Doctor /</text>
    <text class="actor-text" x="135" y="662">Clinic Staff</text>
  </g>

  <rect class="system" x="270" y="85" width="1050" height="760" rx="10"/>
  <text class="title" x="795" y="124" text-anchor="middle">Gynecology Clinic Digitalization System</text>

  <ellipse class="case" cx="465" cy="185" rx="135" ry="38"/>
  <text class="case-text" x="465" y="185">Login</text>

  <ellipse class="case" cx="770" cy="185" rx="150" ry="38"/>
  <text class="case-text" x="770" y="185">View Dashboard</text>

  <rect class="group" x="325" y="270" width="285" height="255" rx="8"/>
  <text class="group-title" x="467" y="303" text-anchor="middle">Patient Management</text>
  <ellipse class="case" cx="467" cy="360" rx="125" ry="36"/>
  <text class="case-text" x="467" y="350">Manage Patient</text>
  <text class="case-text" x="467" y="372">Records</text>
  <ellipse class="case" cx="467" cy="438" rx="125" ry="36"/>
  <text class="case-text" x="467" y="438">Search Patients</text>
  <ellipse class="case" cx="467" cy="492" rx="125" ry="36"/>
  <text class="case-text" x="467" y="482">Restore Deleted</text>
  <text class="case-text" x="467" y="504">Patients</text>

  <rect class="group" x="645" y="270" width="300" height="405" rx="8"/>
  <text class="group-title" x="795" y="303" text-anchor="middle">Clinical Care</text>
  <ellipse class="case" cx="795" cy="360" rx="125" ry="36"/>
  <text class="case-text" x="795" y="360">Manage Visits</text>
  <ellipse class="case" cx="795" cy="438" rx="125" ry="36"/>
  <text class="case-text" x="795" y="438">Track Follow-Ups</text>
  <ellipse class="case" cx="795" cy="516" rx="125" ry="36"/>
  <text class="case-text" x="795" y="506">Manage</text>
  <text class="case-text" x="795" y="528">Prescriptions</text>
  <ellipse class="case" cx="795" cy="594" rx="125" ry="36"/>
  <text class="case-text" x="795" y="584">Use Reusable</text>
  <text class="case-text" x="795" y="606">Templates</text>
  <ellipse class="case" cx="795" cy="648" rx="125" ry="36"/>
  <text class="case-text" x="795" y="638">Upload and Manage</text>
  <text class="case-text" x="795" y="660">Attachments</text>

  <rect class="group" x="980" y="270" width="285" height="255" rx="8"/>
  <text class="group-title" x="1122" y="303" text-anchor="middle">Clinic Operations</text>
  <ellipse class="case" cx="1122" cy="376" rx="128" ry="38"/>
  <text class="case-text" x="1122" y="366">Book and Manage</text>
  <text class="case-text" x="1122" y="388">Appointments</text>
  <ellipse class="case" cx="1122" cy="470" rx="128" ry="38"/>
  <text class="case-text" x="1122" y="460">Manage Billing</text>
  <text class="case-text" x="1122" y="482">Records</text>

